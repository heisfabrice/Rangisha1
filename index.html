    <!-- Theme Early Initialization (Prevents Light Mode Flash) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('rangisha_theme') || localStorage.getItem('ranga_theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            if (!saved) localStorage.setItem('rangisha_theme', 'dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
